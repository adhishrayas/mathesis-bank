# Build and push a Mathlib build environment — the image pair a deposit pins.
#
#   gcloud builds submit deploy/builder \
#     --config deploy/builder/cloudbuild.yaml \
#     --substitutions=_REPO=mathesis-environments
#
# WHY CLOUD BUILD RATHER THAN A LAPTOP
# ------------------------------------
# The runner and Cloud Run are amd64. Building these on an Apple Silicon machine yields arm64
# images that fail there with `exec format error`, which `ci/gate_deposit.sh` reports as
# "reject — submission.lean failed to build" against a depositor whose proof was fine. Cloud
# Build workers are natively amd64, so there is no emulation and no platform flag to forget.
#
# It also has the disk. The three images here are ~23 GB (exporter), ~12 GB (builder) and one
# small layer on top of the builder (export runtime), plus the intermediate `fetch` tree — well
# past what a default worker carries, hence diskSizeGb below.
#
# WHAT GETS PUSHED, AND WHAT DOES NOT
# -----------------------------------
# Only the two RUNTIME images. The `exporter` stage carries Mathlib's source, its build tree and
# `lean4export`; it exists to produce the trusted reference and is never handed to a deposit, so
# it stays local to the build.
#
#   builder    environments.builder_image   toolchain + oleans; runs UNTRUSTED deposit code
#   exportrt   environments.export_image    builder + lean4export; runs the gate's export step
#
# The export runtime is built FROM the builder IMAGE, so its layers ARE the builder's layers and
# the registry stores the base once. Step `verify-shared-base` asserts that rather than assuming
# it: as sibling stages these were 12.2 + 12.5 GB with only 2.04 GB shared, i.e. 22.7 GB to pull
# onto a runner with ~14 GB of disk.

timeout: 10800s          # 3h. `lake exe cache get` pulls 8,542 files.

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 500
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: mathesis-environments
  _LEAN_VERSION: v4.31.0
  _MATHLIB_REV: fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
  # Kept explicit rather than derived: Cloud Build substitutions cannot slice a string, and a
  # tag that silently disagreed with _MATHLIB_REV would name an environment that is not the one
  # inside it.
  _TAG: v4.31.0-mathlib-fabf563

steps:
  # 1. The exporter. Local only — it is the source of the lean4export binary and of the trusted
  #    reference, and must never reach a deposit.
  - id: exporter
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=exporter
      - --build-arg=LEAN_VERSION=${_LEAN_VERSION}
      - --build-arg=MATHLIB_REV=${_MATHLIB_REV}
      - -f=Dockerfile.mathlib
      - -t=mathesis-exporter:local
      - .

  # 2. The deposit builder. Default target, deliberately: a bare build of Dockerfile.mathlib
  #    yields the image that runs untrusted code rather than one carrying extra tools.
  - id: builder
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=LEAN_VERSION=${_LEAN_VERSION}
      - --build-arg=MATHLIB_REV=${_MATHLIB_REV}
      - -f=Dockerfile.mathlib
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-builder:${_TAG}
      - .

  # 3. The export runtime, FROM the builder image. One small layer on a shared base.
  - id: exportrt
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f=Dockerfile.exportrt
      - --build-arg=BUILDER_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-builder:${_TAG}
      - --build-arg=EXPORTER_IMAGE=mathesis-exporter:local
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-exporter-rt:${_TAG}
      - .

  # 4. The property the whole layout exists for. A size comparison is too weak — identical sizes
  #    with different digests was exactly the failure mode — so this asserts the builder's layer
  #    list is a strict PREFIX of the export image's.
  - id: verify-shared-base
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        B="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-builder:${_TAG}"
        E="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-exporter-rt:${_TAG}"
        docker image inspect "$$B" --format '{{range .RootFS.Layers}}{{.}}{{"\n"}}{{end}}' \
          | sed '/^$$/d' > /workspace/b.layers
        docker image inspect "$$E" --format '{{range .RootFS.Layers}}{{.}}{{"\n"}}{{end}}' \
          | sed '/^$$/d' > /workspace/e.layers
        nb=$$(wc -l < /workspace/b.layers)
        ne=$$(wc -l < /workspace/e.layers)
        echo "builder $$nb layers, export $$ne layers"
        if ! diff -q <(head -n "$$nb" /workspace/e.layers) /workspace/b.layers >/dev/null; then
          echo "FATAL: the export image does not extend the builder."
          echo "       Both would be pulled and stored in full — 22.7 GB onto a ~14 GB runner."
          exit 1
        fi
        echo "ok: export image extends the builder ($$nb shared, $$((ne - nb)) added)"
        arch=$$(docker image inspect "$$B" --format '{{.Architecture}}')
        [ "$$arch" = "amd64" ] || { echo "FATAL: builder is $$arch, expected amd64"; exit 1; }
        echo "ok: amd64"

  # 5. Is the trusted reference architecture-independent? It was produced and verified
  #    byte-reproducible on arm64; the candidates it is compared against will be produced here,
  #    on amd64. If those disagree, `environments.mathlib_reference_sha256` would be recording a
  #    reference from a different world than the deposits it guards. Reported, not enforced —
  #    the operator compares it to the recorded value.
  - id: reference-sha
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DECLS=$$(sed 's/#.*//' /workspace/mathlib-reference.decls | tr -s '[:space:]' '\n' \
                 | sed '/^$$/d' | tr '\n' ' ')
        docker run --rm -e DECLS="$$DECLS" --entrypoint sh mathesis-exporter:local -c '
          BIN="$$(cat /l4e/.binpath)"
          LEAN_PATH=/oleans "$$BIN" Mathlib -- $$DECLS > /tmp/ref.export 2>/tmp/ref.err
          if grep -Eiq "panic|internal error|stack overflow" /tmp/ref.err; then
            echo "FATAL: lean4export panicked"; tail -5 /tmp/ref.err; exit 1
          fi
          printf "reference sha256 (amd64): "; sha256sum /tmp/ref.export | cut -d" " -f1
          printf "reference bytes:          "; wc -c < /tmp/ref.export'
        echo "compare against the recorded environments.mathlib_reference_sha256"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-builder:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/lean-exporter-rt:${_TAG}

[package]
name = "record"
description = "Deterministic static generation of the verified record from the committed bank manifests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accession = { path = "../accession" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v5"] }

[[bin]]
name = "recordgen"
path = "src/bin/recordgen.rs"

[[bin]]
name = "bankgen"
path = "src/bin/bankgen.rs"

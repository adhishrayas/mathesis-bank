# The static record generator: the verified record rendered from the committed
# bank manifests (`bank/`), with no database and no server.

[workspace]
resolver = "3"
members = [
    "crates/accession",
    "crates/record",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
accession = { path = "crates/accession" }
record = { path = "crates/record" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

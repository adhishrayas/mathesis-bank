# ---------------------------------------------------------------------------------------------
# Tell the person whose record this was.
#
# A deposit takes minutes of real compute and then waits on a human to merge it. Until now the
# depositor learned that had happened by going and looking. Nothing told them.
#
# WHY A COMMENT AND NOT AN EMAIL
#
# Stet holds no email address for anybody and cannot obtain one: sign-in requests `read:user`,
# for which GitHub returns no address. Keeping addresses would mean a table of them, a consent
# screen change for everyone who only wants to read, and one more thing to leak. GitHub already
# mails people about mentions, through notification settings they control. What this chooses is
# the content, not the envelope.
#
# `pull_request_target`, not `pull_request`: a record may be proposed from a fork, and a
# fork-triggered `pull_request` gets a read-only token that cannot comment. Nothing here checks
# out or runs any code from the pull request — it reads the body and posts a comment — so the
# usual hazard of that trigger does not arise.
# ---------------------------------------------------------------------------------------------
name: merged

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  tell:
    # Closed is not merged. A pull request somebody closed unmerged is a decision the depositor
    # may well want to hear about, but not in these words and not from this.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell the depositor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          # The marker `publish.py` writes into every body it opens. Read as a marker rather than
          # parsed out of the prose, so rewording the pull request cannot silently stop this —
          # and absent on anything a person opened by hand, which is exactly when to say nothing.
          m = re.search(r"<!-- stet-record (.*?) -->", os.environ.get("PR_BODY") or "")
          if not m:
              print("no stet-record marker; this was not opened by the publisher")
              sys.exit(0)
          f = dict(p.split("=", 1) for p in m.group(1).split() if "=" in p)
          login, claim = f.get("login", ""), f.get("claim", "")
          if not login or not claim:
              print(f"marker is incomplete: {f}")
              sys.exit(0)

          body = (
              f"@{login} — this is published.\n\n"
              f"Your record is **`{claim}`**, and it is live now:\n\n"
              f"https://stet.world/a/{claim}/\n\n"
              "The statement, its argument graph, the axioms it reaches and the frozen export "
              "are all on that page. The accession is permanent: it is what to cite, and it "
              "will not change.\n"
          )
          subprocess.run(
              ["gh", "pr", "comment", os.environ["NUMBER"],
               "--repo", os.environ["REPO"], "--body", body],
              check=True,
          )
          PY
